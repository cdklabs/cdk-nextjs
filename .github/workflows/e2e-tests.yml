name: e2e-tests
on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    # `ready_for_review`: a draft runs nothing (see `check-if-should-run`), so
    # marking it ready is what starts its first run.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
    # A PR that changes only these runs nothing: no example deploys differently.
    # GitHub matches them against the whole PR diff on every event, so the first
    # push that touches anything else starts a run. Docs, and what only the
    # e2e-harness workflow reads. Not YAML in general: the examples' pnpm
    # catalog (the `next` they deploy) and these jobs' actions are YAML.
    # GitHub only reads the first 300 changed files, so a larger PR can be
    # skipped wrongly - the run after merge, on main, still catches it.
    # Pushes to main always run.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/e2e-harness.yml"
      - ".github/actions/build-nextjs/**"
      - "scripts/e2e-harness/**"
      - "scripts/e2e-*.sh"
      - "test/deploy-tests-manifest.json"
      - "test/harness-smoke-manifest.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
# Only the deploy jobs get a token permission: `id-token: write`, for AWS OIDC.
# Each also repeats the fork test (`&same-repo`), so a later `needs` or
# `always()` change can't hand a fork's code those credentials.
permissions: {}
env:
  ENV: ${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.number) || github.ref_name }}
jobs:
  # The gate every deploy job needs: skip e2e tests via a label, never deploy a
  # fork's code, and always run on a push to main. A fork's code never runs here,
  # not even after a manual approval, because these jobs get AWS credentials
  # through OIDC; a maintainer recreates the change on a branch in this
  # repository instead (see CONTRIBUTING.md). `pull_request_target` reads this
  # condition from the base branch, so a fork can't change it.
  check-if-should-run:
    runs-on: ubuntu-24.04-arm
    # `github.event_name == 'push'` -> will run after merge to main
    # `head.repo.full_name == github.repository` -> won't run for a PR from a fork
    # `!github.event.pull_request.draft` -> won't run for a draft PR
    # `!contains(github.event.pull_request.labels.*.name, 'skip-e2e-tests')` -> won't run when the PR has label: skip-e2e-tests
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'skip-e2e-tests')) }}
    steps:
      - run: echo "Workflow should run"

  glbl-fns:
    needs: check-if-should-run
    if: &same-repo ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      id-token: write
    runs-on: ubuntu-24.04-arm
    # This example declares `functionGroups` (see its app.ts), so it is the job
    # that exercises splitting. The name must match the group owning `/api/**`.
    env:
      E2E_FUNCTION_GROUPS: api
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # For pull_request_target, checkout PR head instead of merge commit
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      - uses: ./.github/actions/run-e2e-tests-on-example
        with:
          aws_account: ${{ vars.AWS_ACCOUNT }}
          example_directory: global-functions
          stack_name: ${{ env.ENV }}-glbl-fns

  glbl-web-fns:
    needs: wait-for-approval
    runs-on: ubuntu-24.04-arm
    # Declares the same `functionGroups` as glbl-fns. Web Functions run Arm64
    # only, so an Arm runner stages `sharp` natively.
    env:
      E2E_FUNCTION_GROUPS: api
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # For pull_request_target, checkout PR head instead of merge commit
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      - uses: ./.github/actions/run-e2e-tests-on-example
        with:
          aws_account: ${{ vars.AWS_ACCOUNT }}
          example_directory: global-web-functions
          stack_name: ${{ env.ENV }}-glbl-web-fns

  glbl-cntnrs:
    needs: check-if-should-run
    if: *same-repo
    permissions:
      id-token: write
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # For pull_request_target, checkout PR head instead of merge commit
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      - uses: ./.github/actions/run-e2e-tests-on-example
        with:
          aws_account: ${{ vars.AWS_ACCOUNT }}
          example_directory: global-containers
          stack_name: ${{ env.ENV }}-glbl-cntnrs

  rgnl-cntnrs:
    needs: check-if-should-run
    if: *same-repo
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # For pull_request_target, checkout PR head instead of merge commit
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      - uses: ./.github/actions/run-e2e-tests-on-example
        with:
          aws_account: ${{ vars.AWS_ACCOUNT }}
          example_directory: regional-containers
          stack_name: ${{ env.ENV }}-rgnl-cntnrs
  rgnl-fns:
    needs: check-if-should-run
    if: *same-repo
    permissions:
      id-token: write
    # x86 on purpose: examples/regional-functions deploys ARM_64, so this is the
    # job that stages `sharp` for an architecture other than the host's.
    runs-on: ubuntu-22.04
    # Declares the same `functionGroups` as glbl-fns, so splitting is exercised
    # behind API Gateway as well as CloudFront.
    env:
      E2E_FUNCTION_GROUPS: api
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          # For pull_request_target, checkout PR head instead of merge commit
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
      - uses: ./.github/actions/run-e2e-tests-on-example
        with:
          aws_account: ${{ vars.AWS_ACCOUNT }}
          example_directory: regional-functions
          stack_name: ${{ env.ENV }}-rgnl-fns
