# Runs vercel/next.js's own e2e suite against a real cdk-nextjs deployment, via
# the Next.js adapter compatibility harness.
#
# Not a per-commit gate - a run builds and ships a deployment per test file.
# `e2e-tests.yml` stays the per-commit gate on all four NextjsTypes; this is the
# correctness signal that no fixture app of ours could give. See
# scripts/e2e-harness/README.md.
#
# The test files are split across `shard_total` parallel jobs, each with a shared
# stack of its own (`hrns-shard-<n>`). A stack can only hold one app at a time, so
# parallelism has to come from more stacks - see "Sharding" in the README.
name: e2e-harness
on:
  workflow_dispatch:
    inputs:
      nextjs_ref:
        description: "vercel/next.js ref to test against (tag matching the `next` version in package.json by default)"
        default: "v16.3.5"
        type: string
      test_filters:
        description: "NEXT_EXTERNAL_TESTS_FILTERS, relative to the next.js checkout"
        default: "../test/deploy-tests-manifest.json"
        type: string
      shard_total:
        description: "How many parallel shards to split the test files across (one stack each). 1 reproduces the old serial run."
        default: "10"
        type: string
  schedule:
    # Sunday 14:00 UTC — morning on both US coasts, and the run's 180-minute
    # ceiling puts the result well inside Sunday, ready to read Monday. Weekly
    # rather than daily because a run ships a deployment per test file: nothing
    # in the suite changes between two consecutive days that a run would catch,
    # and `e2e-tests.yml` is still the per-commit gate. The sweep job below runs
    # on the same schedule, catching stacks a cancelled run left behind.
    - cron: "0 14 * * 0"

concurrency:
  # Never two runs at once. Shards within a run get a stack each, but two runs
  # would reuse the same shard names and each would deploy over the other's app.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    # A matrix cannot be built from an input directly, so the shard list is
    # computed here. Cheap enough to be worth keeping the count in one place.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      total: ${{ steps.shards.outputs.total }}
    steps:
      - id: shards
        env:
          SHARD_TOTAL: ${{ inputs.shard_total || '10' }}
        # Bounded above because every shard is a CloudFront distribution and a
        # full next.js build of its own: past a couple of dozen the setup cost
        # dominates and the account starts to notice.
        run: |
          node -e '
            const total = Number(process.env.SHARD_TOTAL);
            if (!Number.isInteger(total) || total < 1 || total > 20) {
              throw new Error(`shard_total must be an integer in 1..20, got ${process.env.SHARD_TOTAL}`);
            }
            const shards = Array.from({ length: total }, (_, i) => i + 1);
            console.log(`shards=${JSON.stringify(shards)}`);
            console.log(`total=${total}`);
          ' >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  harness:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      # One shard's failure says nothing about another's, and each holds a stack
      # that its own `always()` step is what deletes. Cancelling the others would
      # leave those to the age-floored sweep a week later.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      NEXTJS_REF: ${{ inputs.nextjs_ref || 'v16.3.5' }}
      TEST_FILTERS: ${{ inputs.test_filters || '../test/deploy-tests-manifest.json' }}
      # The stack this shard owns, read by `harness_stack_name` in
      # scripts/e2e-harness/common.sh. Every step below that touches AWS - warm,
      # deploy, sweep - resolves the same name from it, which is the whole of what
      # keeps two shards from deploying into each other.
      HARNESS_SHARED_STACK_SUFFIX: shard-${{ matrix.shard }}
    steps:
      - name: Checkout cdk-nextjs
        uses: actions/checkout@v4

      - name: Checkout vercel/next.js
        uses: actions/checkout@v4
        with:
          repository: vercel/next.js
          ref: ${{ env.NEXTJS_REF }}
          path: nextjs
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/GitHubActionRole

      - name: Build cdk-nextjs
        run: |
          pnpm i
          pnpm bundle && pnpm compile

      - name: Install and build next.js
        working-directory: nextjs
        # The harness runs out of a next.js checkout: `run-tests.js` and the
        # `test/lib` helpers are repo files, not published ones.
        run: |
          corepack enable
          pnpm install
          pnpm build
          pnpm install

      - name: Install Playwright browser
        working-directory: nextjs
        run: pnpm playwright install --with-deps chromium

      - name: Warm this shard's stack
        # Creating the CloudFront distribution takes ~240s, and the harness
        # runs `createNext` inside jest's `beforeAll` - so without this the first
        # test file is charged that wait against NEXT_E2E_TEST_TIMEOUT below,
        # fails wholesale, and only passes on retry. Pay it once, here, where
        # nothing is timing us. Once per shard, but all in parallel, so the wall
        # clock is the same ~4 minutes however many shards there are.
        run: ./scripts/e2e-warm.sh
        env:
          ADAPTER_DIR: ${{ github.workspace }}

      - name: Run the harness
        working-directory: nextjs
        env:
          NEXT_TEST_MODE: deploy
          NEXT_E2E_TEST_TIMEOUT: 240000
          NEXT_EXTERNAL_TESTS_FILTERS: ${{ env.TEST_FILTERS }}
          IS_TURBOPACK_TEST: 1
          # cdk-nextjs *is* an adapter deployment, and next.js's suite asks. Ten
          # e2e files branch on this, most of them by way of
          # `skipDeployment: !isAdapterTest` - left unset they report a pass in
          # ~5s having deployed nothing. Only the Vercel deploy path reads it for
          # anything else (a team and token), and a custom deploy script never
          # reaches that path.
          NEXT_ENABLE_ADAPTER: 1
          NEXT_TEST_JOB: 1
          NEXT_TELEMETRY_DISABLED: 1
          ADAPTER_DIR: ${{ github.workspace }}
          NEXT_TEST_DEPLOY_SCRIPT_PATH: ${{ github.workspace }}/scripts/e2e-deploy.sh
          NEXT_TEST_DEPLOY_LOGS_SCRIPT_PATH: ${{ github.workspace }}/scripts/e2e-logs.sh
          NEXT_TEST_CLEANUP_SCRIPT_PATH: ${{ github.workspace }}/scripts/e2e-cleanup.sh
        # `-c 1` is mandatory, not a tuning choice: every test file in this shard
        # deploys into this shard's one stack, so two at once would race.
        # Parallelism comes from `-g`, which splits the file list across shards
        # *after* NEXT_EXTERNAL_TESTS_FILTERS has been applied (`run-tests.js`
        # filters, then groups) - so the shards partition the manifest, not the
        # whole of `test/e2e/**`. With no KV timing data configured the split is
        # round-robin over that list, which is deterministic and near enough:
        # per-file cost here is dominated by build-and-deploy, not by the tests.
        # See `harness_stack_name` in scripts/e2e-harness/common.sh.
        run: node run-tests.js --timings -c 1 --type e2e -g ${{ matrix.shard }}/${{ needs.plan.outputs.total }}

      - name: Delete this shard's stack
        if: ${{ always() }}
        # `e2e-cleanup.sh` keeps the stack alive between test files on purpose, so
        # this is the step that actually deletes it - not a backstop. `--shared`
        # resolves HARNESS_SHARED_STACK_SUFFIX, so each shard deletes only its
        # own, which is what lets the age floor go: dropping the floor
        # account-wide instead would also delete the other shards' stacks, and an
        # isolated stack a developer had running at the time.
        run: ./scripts/e2e-sweep.sh --apply --shared

  sweep:
    # Independent of the run above so that a cancelled or timed-out run still
    # gets swept the next day: the age floor means this can never touch a stack
    # belonging to a run in progress.
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/GitHubActionRole
      - run: ./scripts/e2e-sweep.sh --apply
