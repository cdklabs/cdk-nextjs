# Runs vercel/next.js's own e2e suite against a real cdk-nextjs deployment, via
# the Next.js adapter compatibility harness.
#
# Not a per-commit gate - a run builds and ships a deployment per test file.
# `e2e-tests.yml` stays the per-commit gate on all four NextjsTypes; this is the
# correctness signal that no fixture app of ours could give. See
# scripts/e2e-harness/README.md.
#
# The test files are split across `shard_total` parallel jobs, each with a shared
# stack of its own (`hrns-shard-<n>`). A stack can only hold one app at a time, so
# parallelism has to come from more stacks - see "Sharding" in the README.
#
# Every shard needs a built vercel/next.js checkout, which sharding multiplies
# rather than divides. So the `nextjs` job below builds it once, into a cache the
# shards restore - and the schedule runs every six days rather than weekly so that
# the cache is always accessed inside GitHub's 7-day eviction window. See "Caching
# the next.js build".
name: e2e-harness
on:
  workflow_dispatch:
    inputs:
      nextjs_ref:
        description: "vercel/next.js ref to test against. Empty means the tag of the `@next/routing` pin in package.json."
        default: ""
        type: string
      test_filters:
        description: "NEXT_EXTERNAL_TESTS_FILTERS, relative to the next.js checkout"
        default: "../test/deploy-tests-manifest.json"
        type: string
      shard_total:
        description: "How many parallel shards to split the test files across (one stack each). 1 reproduces the old serial run."
        default: "10"
        type: string
      nextjs_type:
        description: "Which root construct to deploy the fixtures with. The schedule always runs global-functions."
        default: global-functions
        type: choice
        options:
          - global-functions
          - regional-functions
          - global-containers
          - regional-containers
  schedule:
    # Every sixth day of the month at 14:00 UTC — morning on both US coasts, and
    # the run's ceiling leaves the result the same day. Not daily, because a run
    # ships a deployment per test file and nothing in the suite changes between two
    # consecutive days that a run would catch; `e2e-tests.yml` is still the
    # per-commit gate.
    #
    # Every six days rather than weekly, and by day-of-month rather than
    # day-of-week, to stay inside GitHub's cache eviction window: it drops an entry
    # not *accessed* in 7 days, and a weekly run sits exactly on that boundary -
    # past it as soon as a scheduled run is delayed under load, which they
    # routinely are. Every run restores the next.js build cache, so a cadence
    # strictly under 7 days keeps it alive with no extra machinery.
    #
    # `*/6` expands to days 1, 7, 13, 19, 25 and 31 (standard cron steps from the
    # range's start, so the 31st is included). Verified over 2026-2029: gaps are 6
    # days within a month and 1, 4 or 5 across a month boundary - never 7. Dropping
    # the 31st, or using `*/7`, would reintroduce the boundary this avoids.
    #
    # The cost is the drift: ~67 runs a year instead of 52, on a day of the week
    # that moves. Read the results whenever one lands, not on a fixed morning.
    - cron: "0 14 */6 * *"

concurrency:
  # Never two runs at once, of any type. Two runs of one type would reuse the same
  # shard names and each would deploy over the other's app. Two *types* would not
  # collide on names - every type but global-functions has a stack infix of its
  # own (`harness_stack_name` in scripts/e2e-harness/common.sh) - but each
  # run's `sweep` is account-wide, and could delete another type's
  # idle-looking shard stack just as that run's shard warms into it.
  #
  # GitHub keeps one *pending* run per group and cancels an older pending one, so
  # dispatch a second type only once the first has started. A cancelled pending
  # run - the scheduled one included - loses no sweep: every run sweeps.
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Per job below: only the jobs that assume the AWS role get `id-token: write`.
# The `nextjs` job runs vercel/next.js's own install and build scripts.
permissions:
  contents: read

jobs:
  plan:
    # A matrix cannot be built from an input directly, so the shard list is
    # computed here - as is the cache key, so that every job below agrees on it
    # and the next.js ref's default is written once rather than per job.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
      nextjs-ref: ${{ steps.plan.outputs.nextjs-ref }}
      cache-key: ${{ steps.plan.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /package.json
          sparse-checkout-cone-mode: false

      - name: Resolve the next.js ref to a commit
        id: resolve
        env:
          NEXTJS_REF: ${{ inputs.nextjs_ref }}
        # The cache key and every checkout below use the commit, not the ref: a
        # moving ref (`canary`, a branch) keyed by name kept restoring the first
        # build made under that name while the logs said it was testing the
        # latest. `^{}` peels an annotated tag to the commit it points at.
        #
        # The default is the tag of the `@next/routing` pin, read rather than
        # written here so that it cannot drift from what the adapter is built
        # against. That pin is exact; `next` itself is a range.
        run: |
          if [ -z "$NEXTJS_REF" ]; then
            NEXTJS_REF="v$(node -p 'require("./package.json").devDependencies["@next/routing"]')"
          fi
          if [[ ! "$NEXTJS_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "nextjs_ref is not a plausible git ref: $NEXTJS_REF" >&2
            exit 1
          fi
          if [[ "$NEXTJS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$NEXTJS_REF"
          else
            refs=$(git ls-remote --heads --tags https://github.com/vercel/next.js "$NEXTJS_REF")
            for candidate in "refs/tags/$NEXTJS_REF^{}" "refs/tags/$NEXTJS_REF" "refs/heads/$NEXTJS_REF"; do
              sha=$(awk -v ref="$candidate" '$2 == ref { print $1; exit }' <<<"$refs")
              [[ -z "$sha" ]] || break
            done
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve vercel/next.js ref $NEXTJS_REF to a commit" >&2
            exit 1
          fi
          echo "Testing vercel/next.js $NEXTJS_REF at $sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Plan the shards and the cache key
        id: plan
        env:
          SHARD_TOTAL: ${{ inputs.shard_total || '10' }}
          NEXTJS_REF: ${{ steps.resolve.outputs.sha }}
        # `shard_total` is bounded above because every shard is a CloudFront
        # distribution and a runner of its own: past a couple of dozen the setup
        # cost dominates and the account starts to notice.
        #
        # The cache key pins everything the cached tree was built by and for: the
        # next.js commit, and the runner image and node major that its node_modules
        # (native addons included) were installed against. Bump `v1` to discard
        # every entry at once.
        run: |
          node -e '
            const total = Number(process.env.SHARD_TOTAL);
            if (!Number.isInteger(total) || total < 1 || total > 20) {
              throw new Error(`shard_total must be an integer in 1..20, got ${process.env.SHARD_TOTAL}`);
            }
            const ref = process.env.NEXTJS_REF;
            const shards = Array.from({ length: total }, (_, i) => i + 1);
            console.log(`shards=${JSON.stringify(shards)}`);
            console.log(`total=${total}`);
            console.log(`nextjs-ref=${ref}`);
            console.log(`cache-key=nextjs-v1-ubuntu-24.04-node24-${ref}`);
          ' >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  nextjs:
    # Builds vercel/next.js once for the whole run, into a cache every shard
    # restores. Sharding multiplies this cost rather than dividing it - ten shards
    # start at the same instant, so none can benefit from another's save - and it
    # is the largest fixed cost left in a run, so it has to happen exactly once.
    #
    # On a hit this job is a lookup and nothing else: `lookup-only` skips the
    # download, which the shards are about to do anyway. On a miss it builds and
    # saves, which costs the run what it used to cost every shard. That is also
    # what makes eviction a speed problem rather than a correctness one - the
    # schedule keeps the entry alive, but nothing breaks if it does not.
    #
    # It is the shards' real restores that count as the access resetting the 7-day
    # eviction clock; this lookup may not, which is why the schedule's cadence and
    # not this job is what keeps the entry warm.
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Look for a cached next.js build
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: |
            nextjs
            ~/.cache/ms-playwright
          key: ${{ needs.plan.outputs.cache-key }}
          lookup-only: true

      - name: Checkout cdk-nextjs
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4

      - if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: pnpm/action-setup@v4
      - if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build next.js
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/build-nextjs
        with:
          ref: ${{ needs.plan.outputs.nextjs-ref }}

      - name: Report what is about to be cached
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        # A repository gets 10 GB of cache in total, evicted least-recently-used,
        # so an entry this size is capable of displacing every other workflow's.
        # Printed rather than asserted, because the number to compare against is
        # whatever the other workflows are using at the time.
        run: du -sh nextjs ~/.cache/ms-playwright

      - name: Save the next.js build
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            nextjs
            ~/.cache/ms-playwright
          key: ${{ needs.plan.outputs.cache-key }}

  harness:
    needs: [plan, nextjs]
    runs-on: ubuntu-24.04
    # The sum of the capped steps below - warm 25, run 150, delete 65 - plus ~50
    # for setup, which is minutes on a cache hit and a next.js build on a miss.
    # The step caps are what guarantee the delete its time; this only has to
    # stay above their sum.
    timeout-minutes: 290
    permissions:
      id-token: write
      contents: read
    strategy:
      # One shard's failure says nothing about another's, and each holds a stack
      # that its own `always()` step is what deletes. Cancelling the others would
      # leave those to the age-floored sweep a week later.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      TEST_FILTERS: ${{ inputs.test_filters || '../test/deploy-tests-manifest.json' }}
      # Read by every harness script, through common.sh. Job-wide, so that warm,
      # deploy and sweep all resolve the same type's stack name.
      HARNESS_NEXTJS_TYPE: ${{ inputs.nextjs_type || 'global-functions' }}
      # The per-file budget `createNext` - build, deploy and all - runs inside. The
      # Containers types add an image build and push and an ECS rollout to every
      # deploy, which the Functions types' 240s does not fit.
      NEXT_E2E_TEST_TIMEOUT: ${{ endsWith(inputs.nextjs_type || 'global-functions', '-containers') && '480000' || '240000' }}
      # The stack this shard owns, read by `harness_stack_name` in
      # scripts/e2e-harness/common.sh. Every step below that touches AWS - warm,
      # deploy, sweep - resolves the same name from it, which is the whole of what
      # keeps two shards from deploying into each other.
      HARNESS_SHARED_STACK_SUFFIX: shard-${{ matrix.shard }}
    steps:
      - name: Checkout cdk-nextjs
        uses: actions/checkout@v4

      - name: Restore the next.js build
        id: nextjs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            nextjs
            ~/.cache/ms-playwright
          key: ${{ needs.plan.outputs.cache-key }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Warn about the cache miss
        if: ${{ steps.nextjs-cache.outputs.cache-hit != 'true' }}
        # The `nextjs` job populated this entry before any shard started, so a miss
        # here means the save failed or the entry was evicted mid-run. Rebuild
        # rather than fail - a slow run still produces the signal the run is for -
        # but say so in the summary, because every shard rebuilding next.js is the
        # difference between a fast run and the two-hour one this replaced.
        run: echo "::warning::next.js build cache miss (${{ needs.plan.outputs.cache-key }}); shard ${{ matrix.shard }} is rebuilding it"

      - name: Build next.js
        if: ${{ steps.nextjs-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/build-nextjs
        with:
          ref: ${{ needs.plan.outputs.nextjs-ref }}

      - name: Build cdk-nextjs
        run: |
          pnpm i
          pnpm bundle && pnpm compile

      - name: Install the Playwright system dependencies
        working-directory: nextjs
        # The browser itself came out of the cache; these are apt packages, which
        # no cache can hold, so this runs on the hit path too. It is a no-op for
        # the download in that case.
        run: pnpm playwright install --with-deps chromium

      - uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/GitHubActionRole
          # Covers the warm and run steps' caps (25 + 150), because the action
          # exports static credentials once and nothing here refreshes them.
          # Assumed here, after the builds, so that a cache-miss rebuild does not
          # eat into it. At the default hour, a shard running ~34 test files at
          # 2-3 min each hit `ExpiredToken` on every file past the ~55-minute mark.
          # The delete step re-assumes its own.
          #
          # Requires `MaxSessionDuration >= 10800` on GitHubActionRole; STS
          # rejects a longer request than the role allows.
          role-duration-seconds: 10800

      - name: Warm this shard's stack
        # Creating the CloudFront distribution takes ~240s, and the harness
        # runs `createNext` inside jest's `beforeAll` - so without this the first
        # test file is charged that wait against NEXT_E2E_TEST_TIMEOUT above,
        # fails wholesale, and only passes on retry. Pay it once, here, where
        # nothing is timing us. Once per shard, but all in parallel, so the wall
        # clock is the same ~4 minutes however many shards there are.
        #
        # Staggered, and retried once. Ten shards creating a distribution in the
        # same minute trip CloudFront's API rate limit (`CreateFunction`: "Rate
        # exceeded"), and a failed create rolls back, so that shard runs nothing.
        # A retry redeploys over the ROLLBACK_COMPLETE stack, which `cdk deploy`
        # deletes and recreates.
        timeout-minutes: 25
        run: |
          sleep $(( (${{ matrix.shard }} - 1) * 20 ))
          ./scripts/e2e-warm.sh || { echo "::warning::warming failed once; retrying"; sleep 60; ./scripts/e2e-warm.sh; }
        env:
          ADAPTER_DIR: ${{ github.workspace }}

      - name: Run the harness
        working-directory: nextjs
        # Capped, so a slow run ends here rather than at the job timeout, and the
        # stack deletion below still gets its 65 minutes to `--wait` for its
        # result. See the job's `timeout-minutes`.
        timeout-minutes: 150
        env:
          NEXT_TEST_MODE: deploy
          NEXT_EXTERNAL_TESTS_FILTERS: ${{ env.TEST_FILTERS }}
          IS_TURBOPACK_TEST: 1
          # cdk-nextjs *is* an adapter deployment, and next.js's suite asks. Ten
          # e2e files branch on this, most of them by way of
          # `skipDeployment: !isAdapterTest` - left unset they report a pass in
          # ~5s having deployed nothing. Only the Vercel deploy path reads it for
          # anything else (a team and token), and a custom deploy script never
          # reaches that path.
          NEXT_ENABLE_ADAPTER: 1
          NEXT_TEST_JOB: 1
          NEXT_TELEMETRY_DISABLED: 1
          ADAPTER_DIR: ${{ github.workspace }}
          NEXT_TEST_DEPLOY_SCRIPT_PATH: ${{ github.workspace }}/scripts/e2e-deploy.sh
          NEXT_TEST_DEPLOY_LOGS_SCRIPT_PATH: ${{ github.workspace }}/scripts/e2e-logs.sh
          # No NEXT_TEST_CLEANUP_SCRIPT_PATH, on purpose: it is optional, and the
          # stack has to outlive each test file. The step below deletes it.
        # `-c 1` is mandatory, not a tuning choice: every test file in this shard
        # deploys into this shard's one stack, so two at once would race.
        # Parallelism comes from `-g`, which splits the file list across shards
        # *after* NEXT_EXTERNAL_TESTS_FILTERS has been applied (`run-tests.js`
        # filters, then groups) - so the shards partition the manifest, not the
        # whole of `test/e2e/**`. With no KV timing data configured the split is
        # round-robin over that list, which is deterministic and near enough:
        # per-file cost here is dominated by build-and-deploy, not by the tests.
        # See `harness_stack_name` in scripts/e2e-harness/common.sh.
        # `--retries 1` explicitly: `run-tests.js` defaults to 2, and every retry
        # is a full build and deploy, so a consistently failing slow file would
        # otherwise take three of them out of the job's time budget.
        run: node run-tests.js --timings -c 1 --retries 1 --type e2e -g ${{ matrix.shard }}/${{ needs.plan.outputs.total }}

      # Re-assumed rather than relied on: this is the step that deletes a stack
      # holding a CloudFront distribution, and it runs under `always()` - after a
      # timeout, which is exactly when the job's original credentials are most
      # likely to be the thing that expired.
      - uses: aws-actions/configure-aws-credentials@v4.2.1
        if: ${{ always() }}
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/GitHubActionRole
          # Outlasts the delete step's cap; the default hour would not.
          role-duration-seconds: 4200

      - name: Delete this shard's stack
        if: ${{ always() }}
        # Nothing deletes the stack between test files, on purpose, so this is
        # the step that actually deletes it - not a backstop. `--shared`
        # resolves HARNESS_SHARED_STACK_SUFFIX, so each shard deletes only its
        # own, which is what lets the age floor go: dropping the floor
        # account-wide instead would also delete the other shards' stacks, and a
        # developer's `dev-<name>` stack running at the time.
        #
        # `--wait`: the next run's shard N deploys into this same stack name, and
        # the workflow's `concurrency` group only holds it back until this job
        # ends. Returning as soon as `delete-stack` is accepted would let it start
        # against a stack still DELETE_IN_PROGRESS (a CloudFront delete takes 15+
        # minutes), and a DELETE_FAILED would go unnoticed until the sweep.
        #
        # 65 minutes: up to 20 for a stack a timed-out run left mid-update to
        # settle (`settled_status`), then a Containers stack's ECS drain and
        # CloudFront delete, which can pass 40.
        timeout-minutes: 65
        run: ./scripts/e2e-sweep.sh --apply --shared --wait

      - name: Check the manifest's screening counts
        # Once per run, in a job that already has the next.js checkout, and only
        # against the default ref - the counts are recorded for that one. Without
        # it, the counts the README quotes go stale silently on a `next` upgrade.
        if: ${{ !cancelled() && matrix.shard == 1 && !inputs.nextjs_ref }}
        run: node scripts/e2e-harness/screen.mjs --next nextjs --check

  sweep:
    # What a cancelled or timed-out run leaves behind is collected by the *next*
    # run, at most six days later on the schedule. That is why this job exists,
    # and it still has to wait for `harness`. The age floor now counts from a stack's
    # last deploy (its server function's `LastModified`, which hotswaps move), not
    # its `CreationTime` - but a `hrns-shard-3` left by an earlier cancelled run
    # is still hours idle at the moment this run's shard 3 is about to
    # `cdk deploy` into it. Sweeping concurrently once issued `delete-stack` on it
    # ~30s in while the deploy started ~4 min in, and a CloudFront delete takes
    # 15+ minutes, so the shard went red. The workflow-level `concurrency` group
    # serializes runs, not the jobs inside one - and it is one group for every
    # type, because this sweep is account-wide.
    #
    # `always()` so that a failed or cancelled shard still gets its leftovers
    # swept rather than waiting another six days. Every run, not just the
    # scheduled one, because a dispatch queued behind a running run cancels a
    # pending scheduled run, and with it this job.
    needs: harness
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/GitHubActionRole
      - run: ./scripts/e2e-sweep.sh --apply
