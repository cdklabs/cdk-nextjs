name: "Run E2E Tests on Example"
description: "Sets up Node.js, PNPM, AWS credentials, builds cdk-nextjs, run e2e tests, clean up"

inputs:
  aws_account:
    description: "AWS account ID"
    required: true
  example_directory:
    description: "cdk-nextjs/examples directory"
    required: true
  stack_name:
    description: "CloudFormation Stack Name"
    required: true
  test_script:
    description: "package.json script to run tests"
    required: false
    default: "test:ci"

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-base
      with:
        aws_account: ${{ inputs.aws_account }}
    - name: Install Playwright browser
      shell: bash
      run: cd examples/e2e-tests && pnpm install-browser
    - name: Log in to Amazon ECR Public
      # The Containers examples build on `public.ecr.aws/docker/library/node`.
      # Pulled anonymously from a shared GitHub runner IP it hit ECR Public's
      # 429 rate limit (pr-271-rgnl-cntnrs, 2026-09-29); authenticated pulls have
      # a far higher one.
      if: ${{ endsWith(inputs.example_directory, '-containers') }}
      shell: bash
      run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - name: Deploy and Run Tests
      shell: bash
      # Several behaviours are answered by different infrastructure per deployment
      # type - a top-level `public/` file with a space in its name is a 404 on API
      # Gateway by design, a repeated slash is collapsed by a CloudFront function
      # only when the compute is a Lambda - and the tests assert the divergence
      # rather than skipping it. The example directory *is* the type.
      env:
        E2E_NEXTJS_TYPE: ${{ inputs.example_directory }}
      run: |
        cd examples/${{ inputs.example_directory }}
        pnpm run deploy:ci
        export E2E_BASE_URL=$(jq -r '."${{ inputs.stack_name }}".CdkNextjsUrl' outputs.json)
        cd ../e2e-tests
        pnpm ${{ inputs.test_script }}
    - uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ inputs.stack_name }}
        path: examples/e2e-tests/playwright-report/
        retention-days: 30
      if: ${{ !cancelled() }}
